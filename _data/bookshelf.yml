- title: The Castle
  author: Franz Kafka
  genre: Fiction
  status: read
  format: physical
  thoughts:
    I did not enjoy reading this book, I did, I think got the overall theme,
    i.e systemic injustice and its effects on inter-personal relationships but either
    the translation was weird or the writing itself, there seems to be no character
    development or sketch of K, it feels like the protagonist is just reacting to
    things, rather than living a reality. I hope my next Kafka book is not like this.

- title: "1984"
  author: George Orwell
  genre: Fiction
  status: read
  format: physical
  recommended: true
  thoughts: |
    Once you've read it, you can't unsee the striking similarity with the real world.

    Tell you what, when I finished reading the book, the government of my country had banned access to public transport because of a protest in the capital.

    - I loved the short romantic relationship b/w Julia & Winston.
    - It was interesting to see how Julia's character was portrayed as someone who is willing to live in a fascist society without getting crazy or making any drastic changes.


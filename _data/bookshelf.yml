# Bookshelf data — powers /library/
#
# Sourced from https://gist.github.com/Bhupesh-V/ecfbb6a7cc7f57051f45968bef8f1f77
# (the data originally backed the standalone bookshelf.bhupesh.me project,
# since folded into this site at bhupesh.me/library). Re-exported here as a
# static snapshot — edit this file directly going forward, it is no longer
# pulled live from the gist.
#
# Each entry:
#   title:       required
#   author:      required
#   genre:       required — used for filtering (e.g. Fiction, Technical, Science)
#   status:      required — one of: on_shelf | reading | read
#   recommended: optional — true to flag as a recommended read
#   thoughts:    optional — a short paragraph of personal notes on the book


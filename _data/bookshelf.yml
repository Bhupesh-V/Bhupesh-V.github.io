- title: The Castle
  author: Franz Kafka
  genre: Fiction
  status: read
  thoughts:
    I did not enjoy reading this book, I did, I think got the overall theme,
    i.e systemic injustice and its effects on inter-personal relationships but either
    the translation was weird or the writing itself, there seems to be no character
    development or sketch of K, it feels like the protagonist is just reacting to
    things, rather than living a reality. I hope my next Kafka book is not like this.


- title: Psycho Cybernetics
  author: Maxwell Maltz
  genre: Self-help
  status: read
  thoughts:
    A book I should have picked during my graduation days. Nevertheless, I
    had known about the major idea from the book when I finished '48 Creative Mediations
    that will enrich your life' during my last days of High School. This book revived
    that knowledge and cleared my stance on how there's not much difference between
    science and religion considering the effects they have on our lives. I only recommended
    this book if you have never read any self-help material.


# Categories group multiple skills under one shareable umbrella — e.g.
# "backend" bundles golang, system-design work into one filterable view.
#
# name:   required — shown in the UI & used in ?category=
# skills: required — list of skill slugs from _data/artifacts.yml to bundle

- name: backend
  skills: [golang, system-design]

- name: infra
  skills: [shell, docker, devops]

- name: community
  skills: [community, open-source]

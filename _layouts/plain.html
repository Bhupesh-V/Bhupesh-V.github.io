<!DOCTYPE html>
<html lang="en">

<head>
  <title>
    {% if page.title %}{{ page.title }}{% else %}Bhupesh Varshney{% endif %}
  </title>
  {% include meta.html %}
  <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
  <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}"
    href="{{ site.baseurl }}/feed.xml" />
  <link rel="icon" href="https://bhupesh.me/images/favicons/headshot.ico" />
  <meta name="google-site-verification" content="4coaO0YVCAhaE5LAetM4wCbwk1TgAjgNA_G0ywyitnI" />
  <script type="application/ld+json">
      { "@context": "https://schema.org",
        "@type": "WebPage",
        "name": "{{ page.title | default: site.name }}",
        "description": "{{ page.description | default: site.description }}",
        "url": "{{ site.url }}{{ page.url }}",
        "inLanguage": "en-US",
        "isPartOf": {
          "@type": "WebSite",
          "name": "{{ site.name }}",
          "url": "{{ site.url }}/"
        },
        "about": {
          "@type": "Person",
          "name": "{{ site.name }}",
          "url": "{{ site.url }}/"
        }
      }
    </script>
  <script>
    if (localStorage.getItem("lightmode") == "disabled") {
      document.documentElement.classList.add("dark-mode");
    }
  </script>
</head>

<body>
  <div id="main" role="main" class="container">
    {{ content }}
  </div>

  {% include analytics.html %}

  <script src="{{ site.baseurl }}/js/site.js" defer></script>
  {% if site.google_analytics %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N4J53QJR31"></script>
  {% endif %}
</body>

</html>

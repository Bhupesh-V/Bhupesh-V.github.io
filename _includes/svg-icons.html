{% if site.footer-links.github %}<a href="https://github.com/{{ site.footer-links.github }}" aria-label="GitHub"><svg class="icon icon-lg mark" aria-hidden="true"><use href="#icon-github"></use></svg></a>{% endif %}
{% if site.footer-links.linkedin %}<a href="https://www.linkedin.com/in/{{ site.footer-links.linkedin }}" aria-label="LinkedIn"><svg class="icon icon-lg mark" aria-hidden="true"><use href="#icon-linkedin"></use></svg></a>{% endif %}
{% if site.footer-links.rss %}<a href="{{ site.baseurl }}/feed.xml" aria-label="RSS Feed"><svg class="icon mark" aria-hidden="true"><use href="#icon-rss"></use></svg></a>{% endif %}
{% if site.footer-links.twitter %}<a href="https://www.twitter.com/{{ site.footer-links.twitter }}" aria-label="Twitter"><svg class="icon icon-lg mark" aria-hidden="true"><use href="#icon-twitter"></use></svg></a>{% endif %}
{% if site.footer-links.youtube %}<a href="https://youtube.com/{{ site.footer-links.youtube }}" aria-label="YouTube"><svg class="icon icon-lg mark" aria-hidden="true"><use href="#icon-youtube"></use></svg></a>{% endif %}
